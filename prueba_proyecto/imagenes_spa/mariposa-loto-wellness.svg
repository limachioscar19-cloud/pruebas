<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lotusPetalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5A4978" />
      <stop offset="45%" stop-color="#C9A96E" />
      <stop offset="90%" stop-color="#ECE6F4" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="sacredCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCEABB" />
      <stop offset="70%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#5A4978" />
    </radialGradient>
  </defs>

  <g transform="translate(0, 5)">
    <!-- Halo de energía zen -->
    <circle cx="100" cy="100" r="75" fill="none" stroke="#ECE6F4" stroke-width="1" stroke-dasharray="4,6" opacity="0.6" />
    <circle cx="100" cy="100" r="88" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.4" />

    <!-- Pétalos / Alas Superiores Exteriores -->
    <path d="M100,85 C75,30 35,20 18,48 C2,72 15,105 45,115 C75,124 95,95 100,85 Z" 
          fill="url(#lotusPetalGrad)" opacity="0.85" stroke="#C9A96E" stroke-width="1.4" />
    <path d="M100,85 C125,30 165,20 182,48 C198,72 185,105 155,115 C125,124 105,95 100,85 Z" 
          fill="url(#lotusPetalGrad)" opacity="0.85" stroke="#C9A96E" stroke-width="1.4" />

    <!-- Pétalos / Alas Superiores Interiores -->
    <path d="M100,88 C80,45 52,38 38,60 C26,78 40,102 65,106 C85,110 95,95 100,88 Z" 
          fill="#FFFFFF" opacity="0.4" />
    <path d="M100,88 C120,45 148,38 162,60 C174,78 160,102 135,106 C115,110 105,95 100,88 Z" 
          fill="#FFFFFF" opacity="0.4" />

    <!-- Pétalos de Loto Inferiores -->
    <path d="M100,95 C78,110 45,118 40,142 C35,165 65,178 85,158 C96,146 98,118 100,95 Z" 
          fill="url(#lotusPetalGrad)" opacity="0.8" stroke="#C9A96E" stroke-width="1.2" />
    <path d="M100,95 C122,110 155,118 160,142 C165,165 135,178 115,158 C104,146 102,118 100,95 Z" 
          fill="url(#lotusPetalGrad)" opacity="0.8" stroke="#C9A96E" stroke-width="1.2" />

    <!-- Flor de Loto central estilizada en el cuerpo -->
    <path d="M100,92 C92,78 88,86 100,104 C112,86 108,78 100,92 Z" fill="#C9A96E" />
    <path d="M100,100 C86,88 78,102 96,112 C88,118 96,128 100,120 C104,128 112,118 104,112 C122,102 114,88 100,100 Z" fill="#5A4978" />

    <!-- Punto de chakra / flor superior -->
    <circle cx="100" cy="72" r="5" fill="url(#sacredCenter)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="100" cy="72" r="1.5" fill="#FFFFFF" />

    <!-- Antenas orquídea -->
    <path d="M99,69 C92,50 78,42 74,46 C70,50 75,56 80,53 C84,50 94,56 98,69" 
          stroke="#C9A96E" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <circle cx="74" cy="46" r="2.2" fill="#F8B500" />
    <path d="M101,69 C108,50 122,42 126,46 C130,50 125,56 120,53 C116,50 106,56 102,69" 
          stroke="#C9A96E" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <circle cx="126" cy="46" r="2.2" fill="#F8B500" />
  </g>
</svg>
