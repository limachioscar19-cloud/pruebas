<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="lilaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ECE6F4" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#8E7CAE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#5A4978" stop-opacity="0.4" />
    </radialGradient>
    <linearGradient id="softStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A669A" />
      <stop offset="100%" stop-color="#2D203F" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 5)">
    <!-- Alas Superiores -->
    <!-- Izquierda -->
    <path d="M100,80 C70,25 25,20 15,48 C5,75 25,105 50,115 C75,122 92,95 100,80 Z" 
          fill="url(#lilaGlow)" stroke="#8E7CAE" stroke-width="1.8" />
    <path d="M96,78 C74,38 40,35 30,52 C22,70 38,92 56,102 C74,108 90,88 96,78 Z" 
          fill="#FAF7FD" opacity="0.45" />

    <!-- Derecha -->
    <path d="M100,80 C130,25 175,20 185,48 C195,75 175,105 150,115 C125,122 108,95 100,80 Z" 
          fill="url(#lilaGlow)" stroke="#8E7CAE" stroke-width="1.8" />
    <path d="M104,78 C126,38 160,35 170,52 C178,70 162,92 144,102 C126,108 110,88 104,78 Z" 
          fill="#FAF7FD" opacity="0.45" />

    <!-- Alas Inferiores con formas redondeadas y suaves -->
    <!-- Izquierda -->
    <path d="M100,95 C75,105 45,110 38,135 C30,162 60,175 80,158 C94,145 98,118 100,95 Z" 
          fill="url(#lilaGlow)" stroke="#8E7CAE" stroke-width="1.5" />
    <!-- Derecha -->
    <path d="M100,95 C125,105 155,110 162,135 C170,162 140,175 120,158 C106,145 102,118 100,95 Z" 
          fill="url(#lilaGlow)" stroke="#8E7CAE" stroke-width="1.5" />

    <!-- Nervaduras de hoja zen -->
    <path d="M100,85 Q65,60 30,62" stroke="#5A4978" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M100,88 Q60,82 45,95" stroke="#5A4978" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M100,92 Q72,120 55,145" stroke="#5A4978" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />

    <path d="M100,85 Q135,60 170,62" stroke="#5A4978" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M100,88 Q140,82 155,95" stroke="#5A4978" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M100,92 Q128,120 145,145" stroke="#5A4978" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Cuerpo delicado -->
    <ellipse cx="100" cy="98" rx="3" ry="22" fill="url(#softStem)" />
    <circle cx="100" cy="72" r="4.5" fill="#43335A" />

    <!-- Antenas gráciles -->
    <path d="M99,70 Q88,52 75,54" stroke="#5A4978" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="74" cy="54" r="2.2" fill="#8E7CAE" />
    <path d="M101,70 Q112,52 125,54" stroke="#5A4978" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="126" cy="54" r="2.2" fill="#8E7CAE" />
  </g>
</svg>
